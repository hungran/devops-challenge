# Reusable: deploy one backend version to one environment.
#
# Per-environment configuration lives in the GitHub Environment (vars only,
# no long-lived secrets - AWS access is via OIDC):
#   AWS_REGION, AWS_DEPLOY_ROLE_ARN, ARTIFACT_BUCKET,
#   CODEDEPLOY_APP, CODEDEPLOY_GROUP, BACKEND_URL
name: _deploy-backend

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      version:
        description: Full git SHA to deploy
        type: string
        required: true
      artifact:
        description: >-
          Name of the GitHub artifact to upload to S3 first. Empty = the bundle
          must already be in S3 (promotion to production, or rollback).
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.BACKEND_URL }}
    concurrency:
      # One deployment per environment at a time; never cancel one mid-flight.
      group: deploy-backend-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      # Inputs go through env, never interpolated into scripts (injection-safe).
      VERSION: ${{ inputs.version }}
      ARTIFACT: ${{ inputs.artifact }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
      CODEDEPLOY_APP: ${{ vars.CODEDEPLOY_APP }}
      CODEDEPLOY_GROUP: ${{ vars.CODEDEPLOY_GROUP }}
      BACKEND_URL: ${{ vars.BACKEND_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts

      - name: Validate inputs
        run: |
          [[ "$VERSION" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::version must be a full git SHA"; exit 1; }
          echo "KEY=backend/${VERSION}.tgz" >> "$GITHUB_ENV"

      - name: Download build artifact
        if: inputs.artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact }}
          path: dist

      - name: Configure AWS credentials (OIDC, short-lived)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gha-backend-${{ inputs.environment }}-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Publish bundle to artifact bucket (immutable)
        if: inputs.artifact != ''
        run: |
          set -euo pipefail
          sha256sum -c "dist/backend-${VERSION}.tgz.sha256"   # integrity across jobs
          # --if-none-match '*' => S3 conditional write: a version is written once
          # and can never be overwritten (re-runs reuse the existing object).
          if aws s3api put-object --bucket "$ARTIFACT_BUCKET" --key "$KEY" \
               --body "dist/backend-${VERSION}.tgz" --if-none-match '*' \
               --metadata "sha256=$(cut -d' ' -f1 "dist/backend-${VERSION}.tgz.sha256")" >/dev/null 2>err.txt; then
            echo "Uploaded s3://$ARTIFACT_BUCKET/$KEY"
          elif grep -q PreconditionFailed err.txt; then
            echo "s3://$ARTIFACT_BUCKET/$KEY already exists, reusing"
          else
            cat err.txt; exit 1
          fi

      - name: Verify bundle exists
        run: |
          aws s3api head-object --bucket "$ARTIFACT_BUCKET" --key "$KEY" >/dev/null \
            || { echo "::error::$KEY not found - was this SHA ever built on main?"; exit 1; }

      - name: Record currently live version (rollback target)
        id: previous
        run: |
          prev=$(curl -fsS --max-time 5 "${BACKEND_URL}/version" | jq -r '.version // empty' || true)
          [[ "$prev" =~ ^[0-9a-f]{40}$ ]] || prev=""   # untrusted remote value: accept SHAs only
          echo "version=${prev}" >> "$GITHUB_OUTPUT"
          echo "Currently live: ${prev:-<none>}"

      - name: Deploy with CodeDeploy
        run: ./scripts/deploy-backend.sh "$KEY" "${GITHUB_WORKFLOW}#${GITHUB_RUN_NUMBER} ${VERSION:0:12}"

      - name: Smoke test through the load balancer
        id: smoke
        run: ./scripts/smoke-test.sh "${BACKEND_URL}/version" "$VERSION" "${BACKEND_URL}/healthz" "${BACKEND_URL}/api/hello"

      # CodeDeploy already rolls back automatically when a lifecycle hook or a
      # CloudWatch alarm fails. This covers the remaining case: the deployment
      # "succeeded" on the hosts but the service is broken from the outside.
      - name: Roll back to previous version
        if: failure() && steps.smoke.outcome == 'failure' && steps.previous.outputs.version != ''
        env:
          PREVIOUS: ${{ steps.previous.outputs.version }}
        run: |
          echo "::warning::Smoke test failed, rolling back to ${PREVIOUS}"
          ./scripts/deploy-backend.sh "backend/${PREVIOUS}.tgz" "Rollback to ${PREVIOUS:0:12}"
          ./scripts/smoke-test.sh "${BACKEND_URL}/version" "$PREVIOUS"

      - name: Summary
        if: always()
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          PREVIOUS: ${{ steps.previous.outputs.version }}
          STATUS: ${{ job.status }}
        run: |
          {
            echo "### Backend → ${ENVIRONMENT}"
            echo "| | |"; echo "|---|---|"
            echo "| Version | \`${VERSION}\` |"
            echo "| Previous | \`${PREVIOUS:-n/a}\` |"
            echo "| Result | ${STATUS} |"
          } >> "$GITHUB_STEP_SUMMARY"
