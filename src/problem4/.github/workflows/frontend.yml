# Frontend: static SPA -> S3 + CloudFront
#
#   PR:            lint + test + build + security scan  (no AWS access at all)
#   push to main:  same -> staging -> [approval] -> production
#   manual:        (re)deploy an already-built SHA to an environment (rollback)
#
# The build is environment-agnostic; per-environment settings are written to
# /config.json at deploy time, so production receives the exact bytes staging
# was tested with.
name: frontend

on:
  pull_request:
    paths: &paths
      - "frontend/**"
      - "scripts/smoke-test.sh"
      - "scripts/publish-frontend.sh"
      - ".github/workflows/frontend.yml"
      - ".github/workflows/_deploy-frontend.yml"
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        required: true
      version:
        description: Full 40-char git SHA of a build that already exists in the artifact bucket
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "22"

jobs:
  build:
    name: Lint, test & build
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      artifact: ${{ steps.meta.outputs.artifact }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - id: meta
        run: |
          echo "version=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "artifact=frontend-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Dependency audit
        # Everything ships to the browser as built JS, so audit all deps.
        run: npm audit --audit-level=high
      - name: Build
        env:
          APP_VERSION: ${{ github.sha }}
        run: npm run build
      - name: Package release
        run: |
          set -euo pipefail
          rm -f dist/config.json   # local-dev config never ships; deploy writes the real one
          jq -n --arg v "$GITHUB_SHA" --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{version:$v, builtAt:$at}' > dist/version.json
          tar -czf "frontend-${GITHUB_SHA}.tgz" -C dist .
          sha256sum "frontend-${GITHUB_SHA}.tgz" | tee "frontend-${GITHUB_SHA}.tgz.sha256"
      - name: Attest provenance
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: frontend/frontend-${{ github.sha }}.tgz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.meta.outputs.artifact }}
          path: |
            frontend/frontend-${{ github.sha }}.tgz
            frontend/frontend-${{ github.sha }}.tgz.sha256
          retention-days: 30
          if-no-files-found: error

  security-scan:
    name: Security scan
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trivy (vulnerabilities, secrets, misconfig)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: frontend
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  deploy-staging:
    name: Deploy to staging
    needs: [build, security-scan]
    if: github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_deploy-frontend.yml
    with:
      environment: staging
      version: ${{ needs.build.outputs.version }}
      artifact: ${{ needs.build.outputs.artifact }}

  deploy-production:
    name: Deploy to production
    needs: [build, deploy-staging]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_deploy-frontend.yml
    with:
      environment: production
      version: ${{ needs.build.outputs.version }}
      artifact: ""

  manual-deploy:
    name: Manual deploy / rollback
    if: github.event_name == 'workflow_dispatch' && vars.DEPLOY_ENABLED == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_deploy-frontend.yml
    with:
      environment: ${{ inputs.environment }}
      version: ${{ inputs.version }}
      artifact: ""
