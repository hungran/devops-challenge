# Access log with upstream timing + request id, so latency and 5xx are measurable.
log_format main_timed '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                      'rt=$request_time urt=$upstream_response_time ust=$upstream_status '
                      'rid=$request_id';

server {
    listen 80;
    access_log /var/log/nginx/access.log main_timed;

    # FIX: resolve the api container through Docker's embedded DNS at request
    # time. A plain `proxy_pass http://api:...` is resolved once at startup, so
    # when the api container is recreated (new IP) nginx keeps hitting the old
    # IP and returns 502 until nginx itself is restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;
    set $api_upstream http://api:3000;   # FIX: was api:3001, the app listens on 3000

    location = / {
        default_type text/plain;
        return 200 "Welcome to the platform\n";
    }

    # nginx's own liveness probe (used by the compose healthcheck).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass $api_upstream;   # variable + no URI => original URI is forwarded

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;

        # FIX: explicit, short timeouts instead of the 60s defaults, so a stuck
        # backend surfaces as a fast 504 rather than piling up connections.
        proxy_connect_timeout 2s;
        proxy_send_timeout    10s;
        proxy_read_timeout    10s;

        # Retry idempotent requests once on connection errors (e.g. during an
        # api restart). nginx never retries non-idempotent methods by default.
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
    }
}
